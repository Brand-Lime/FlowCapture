[package]
name = "flowcapture"
version = "0.1.0"
description = "AI-powered workflow documentation engine"
authors = ["FlowCapture"]
edition = "2021"

[lib]
name = "flowcapture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "multipart"] }
active-win-pos-rs = "0.8"
parking_lot = "0.12"
regex = "1"
base64 = "0.22"
dirs = "6"
device_query = "3.0"
async-trait = "0.1"
pulldown-cmark = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Linux uses xcap 0.4.x (X11/dbus) to avoid PipeWire 1.0+ required by xcap 0.5+ on Ubuntu 22.04.
[target.'cfg(target_os = "linux")'.dependencies]
xcap = "=0.4.1"
dbus = "0.9"
percent-encoding = "2.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.6"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"
core-graphics = "0.24"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25"
# Same versions Tauri/wry use, so the WebView2 handles from `with_webview` share their types.
webview2-com = "0.38"
windows = "0.61"
# Installer and auto-update (Velopack fork, pre-launch update window): see src/updater.rs.
velopack = { path = "vendor/velopack" }
